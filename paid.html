<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paid Notes · Nursing Media</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .paid-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:12px;box-shadow:var(--shadow)}
    .paid-card h3{font-size:18px;margin-bottom:6px}
    .paid-card .body{color:var(--ink-soft);font-size:14.5px;line-height:1.7;margin-top:10px}
    .paid-card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  </style>
</head>
<body>
  <div class="ubar"><div class="wrap">
    <span>Paid Section · <b id="who">…</b></span>
    <span><a href="index.html">Home</a> · <a href="#" id="paidLogout">Logout</a></span>
  </div></div>
  <header class="mast"><div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="assets/logo.png" alt="logo" /></span>
      <span><b>Nursing Media</b><small>Paid Notes 🔒</small></span>
    </a>
  </div></header>
  <main class="wrap" style="max-width:820px;margin:26px auto 64px">
    <h1 style="font-size:clamp(24px,4vw,34px)">Paid Notes</h1>
    <p style="color:var(--muted);font-size:14.5px;margin:6px 0 18px">Sirf paid ID se — logout karte hi band.</p>
    <div id="list"><p>Loading…</p></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    if (typeof firebase === "undefined") {
      document.write(
        '<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"><\/script>' +
        '<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"><\/script>'
      );
    }
  </script>
  <script src="js/firebase-config.js"></script>
  <script src="js/fb.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    (async () => {
      if (!window.FB || !FB.isReady()) { $("list").innerHTML = "<p>Firebase config missing.</p>"; return; }
      const sess0 = FB.paidSession();
      if (!sess0) { window.location.href = "paid-login.html?next=paid.html"; return; }
      // revoke check: ID ab bhi active hai?
      let sess;
      try { sess = await FB.paidRefresh(); }
      catch (e) { window.location.href = "paid-login.html"; return; }
      // notes load
      try {
        const fresh = await FB.listPaidNotes();
        $("who").textContent = sess.id + (sess.name ? " · " + sess.name : "");
        $("list").innerHTML = fresh.map((t) => `
          <div class="paid-card"><h3>${esc(t.title)}</h3>
            <div class="body">${t.content || "<i>Content jald aa raha</i>"}</div>
            <div class="row">
              ${t.pdf ? `<a class="btn btn-sm" href="${esc(t.pdf)}" target="_blank" rel="noopener">PDF ↗</a>` : ""}
              ${t.video ? `<a class="btn btn-sm" href="${esc(t.video)}" target="_blank" rel="noopener">Video ↗</a>` : ""}
            </div>
          </div>`).join("") || "<p>Koi paid note nahi — admin se poocho.</p>";
      } catch (e) {
        // revoke hua to session udao
        if (/revoke|permission|denied/i.test(e.message || "")) { FB.paidLogout(); window.location.href = "paid-login.html"; return; }
        $("list").innerHTML = "<p>Load fail: " + esc(e.message || e) + "</p>";
      }
    })();
    $("paidLogout").addEventListener("click", (e) => {
      e.preventDefault();
      try { FB.paidLogout(); } catch (_) {}
      window.location.href = "paid-login.html";
    });
  </script>
</body>
</html>
